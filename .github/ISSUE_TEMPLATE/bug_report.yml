name: 🐛 Bug Report
description: Report something on the site that looks or behaves incorrectly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please fill out the fields below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I click "Play Reel", the video…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The video should play once and return to the image.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Scroll to '...'
        3. Click on '...'
        4. See the issue
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device type
      options:
        - Desktop
        - Mobile
        - Tablet
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: e.g. Chrome 120 on Windows 11, Safari on iOS 17
      placeholder: Chrome 120 on Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Site version
      description: The version/commit shown in the site footer (e.g. v1.0.0 · 9a8a78d), if visible.
      placeholder: v1.0.0 · 9a8a78d
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag-and-drop screenshots or screen recordings here if relevant.
    validations:
      required: false

name: Deploy to GitHub Pages

# Static site: index.html, llms.txt, and favicon.svg are committed as-is.
# No build step, nothing to compile - this just stages those files and
# hands them to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html llms.txt _site/
          [ -f favicon.svg ] && cp favicon.svg _site/ || true
          [ -f favicon.ico ] && cp favicon.ico _site/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .bg { fill: #031a07; }
    .fg { fill: #8fffb0; }
    .cursor {
      fill: #8fffb0;
      animation: blink 1.06s step-end infinite;
    }
    @keyframes blink {
      0%   { opacity: 1; }
      50%  { opacity: 0; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; opacity: 1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="100" height="100" rx="20" />
  <text
    x="12"
    y="66"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="46"
    font-weight="700"
  ><tspan class="fg">&gt;</tspan><tspan class="cursor">_</tspan></text>
</svg>
